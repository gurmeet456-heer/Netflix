<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file_name }}</title>
    
    <!-- External Stylesheets -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.6.9/plyr.min.css">
    
    <!-- Local CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav>
        <div class="nleft">
            <h4 class="magnet">STREAM MARKET</h4>
        </div>
        <div class="nryt">
            <a href="#main" class="home-btn magnet">Home</a>
            <a href="#sec1" class="about-btn magnet">About</a>
        </div>
    </nav>

    <div class="outer">
        <div class="inner">
            <div class="main" id="main">
                <video id="player" class="player" src="{{ file_url }}" type="video/mp4" playsinline controls width="100%"></video>
                <div class="file-name">
                    <h4>File name: </h4>
                    <p id="myDiv">{{ file_name }}</p>
                </div>
                <div class="downloadBtn">
                    <button class="magnet" onclick="openPlayer('vlc')"><img src="vlc.png" alt="">VLC</button>
                    <button class="magnet" onclick="openPlayer('mx')"><img src="mx.png" alt="">MX</button>
                    <button class="magnet" onclick="openPlayer('playit')"><img src="playit.png" alt="">PlayIt</button>
                    <button class="magnet" onclick="openPlayer('km')"><img src="km.png" alt="">KM</button>
                    <button class="magnet" onclick="openPlayer('s')"><img src="s.png" alt="">S Player</button>
                    <button class="magnet" onclick="openPlayer('hd')"><img src="hd.png" alt="">HD</button>
                    <button class="magnet" onclick="bisalDownload()"><img src="download.png" alt="">Download</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.6.9/plyr.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
